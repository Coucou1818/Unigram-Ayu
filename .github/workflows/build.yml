name: Build Unigram with Prism/Ayu Features

on:
  workflow_dispatch:
  push:
    branches: [ develop, main ]

jobs:
  build:
    runs-on: windows-2025-vs2026
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Clone and Bootstrap vcpkg
        shell: pwsh
        run: |
          git clone https://github.com/microsoft/vcpkg.git ../vcpkg
          cd ../vcpkg
          git checkout c3867e714dd3a51c272826eea77267876517ed99
          .\bootstrap-vcpkg.bat -disableMetrics

      - name: Setup App Credentials
        shell: pwsh
        run: |
          $content = @"
          namespace Telegram
          {
              public static partial class Constants
              {
                  static Constants()
                  {
                      ApiId = 2040;
                      ApiHash = "b18441a1ff607e10a989891a5462e627";
                      AppChannel = "unigramapp";
                  }
              }
          }
          "@
          Set-Content -Path "Telegram/Constants.Secret.cs" -Value $content

      - name: Download td_api.tl schema
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "Libraries/tdjson"
          Invoke-WebRequest -Uri "https://raw.githubusercontent.com/tdlib/td/master/td/generate/scheme/td_api.tl" -OutFile "Libraries/tdjson/td_api.tl"

      - name: Provide Prebuilt TDLib Binaries
        shell: pwsh
        run: |
          $tripletDir = "Libraries/tdjson/x64-uwp"
          New-Item -ItemType Directory -Force -Path $tripletDir
          
          # 创建符号占位文件 tdjson.pdb
          if (-not (Test-Path "$tripletDir/tdjson.pdb")) {
              New-Item -ItemType File -Force -Path "$tripletDir/tdjson.pdb"
          }
          
          Write-Host "TDLib dependencies in tree:"
          Get-ChildItem $tripletDir

      - name: Build Modern Release Package
        shell: pwsh
        run: |
          .\Build.Modern.ps1 -Platform x64 -Configuration Release -Mode SideloadOnly

      - name: Build Windows Setup EXE (Inno Setup)
        shell: pwsh
        run: |
          Write-Host "Installing Inno Setup via choco..."
          choco install innosetup --yes --no-progress
          
          $msix = Get-ChildItem -Path "Telegram.Msix.Modern/AppPackages" -Recurse -Filter "*_x64.msix" | Select-Object -First 1
          if (-not $msix) {
              $msix = Get-ChildItem -Path "Telegram/AppPackages" -Recurse -Filter "*_x64.msix" | Select-Object -First 1
          }
          Write-Host "Found MSIX: $($msix.FullName)"

          $unpackDir = "C:\UnpackApp"
          New-Item -ItemType Directory -Force -Path $unpackDir
          $makeappx = "C:\Program Files (x86)\Windows Kits\10\bin\10.0.22621.0\x64\makeappx.exe"
          & $makeappx unpack /p $msix.FullName /d $unpackDir /o

          $issContent = @"
          [Setup]
          AppName=Unigram PrismGram+
          AppVersion=13.1.3.0
          DefaultDirName={autopf}\UnigramPrismAyu
          DefaultGroupName=Unigram PrismGram+
          OutputDir=.
          OutputBaseFilename=Unigram_PrismAyu_Setup_x64
          Compression=lzma2/ultra64
          SolidCompression=yes
          ArchitecturesInstallIn64BitMode=x64
          DisableProgramGroupPage=yes
          PrivilegesRequired=lowest

          [Files]
          Source: "$unpackDir\*"; DestDir: "{app}"; Flags: ignoreversion recursesubdirs createallsubdirs

          [Icons]
          Name: "{autoprograms}\Unigram PrismGram+"; Filename: "{app}\Telegram.Modern\Telegram.exe"
          Name: "{autodesktop}\Unigram PrismGram+"; Filename: "{app}\Telegram.Modern\Telegram.exe"

          [Run]
          Filename: "{app}\Telegram.Modern\Telegram.exe"; Description: "运行 Unigram PrismGram+"; Flags: nowait postinstall skipifsilent
          "@
          Set-Content -Path "setup.iss" -Value $issContent

          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" setup.iss
          Write-Host "Setup EXE build complete: Unigram_PrismAyu_Setup_x64.exe"

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Unigram-PrismAyu-Package
          path: |
            Unigram_PrismAyu_Setup_x64.exe
            Telegram.Msix.Modern/AppPackages/**/*.msixbundle
            Telegram.Msix.Modern/AppPackages/**/*.msix
            Telegram/AppPackages/**/*.msixbundle
            Telegram/AppPackages/**/*.msix
