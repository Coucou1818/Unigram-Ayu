name: Build Unigram with Prism/Ayu Features

on:
  workflow_dispatch:
  push:
    branches: [ develop, main ]

jobs:
  build:
    runs-on: windows-2025-vs2026
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Clone and Bootstrap vcpkg
        shell: pwsh
        run: |
          git clone https://github.com/microsoft/vcpkg.git ../vcpkg
          cd ../vcpkg
          git checkout c3867e714dd3a51c272826eea77267876517ed99
          .\bootstrap-vcpkg.bat -disableMetrics

      - name: Setup App Credentials
        shell: pwsh
        run: |
          $content = @"
          namespace Telegram
          {
              public static partial class Constants
              {
                  static Constants()
                  {
                      ApiId = 2496;
                      ApiHash = "8da85b0d5b160236f12d7352725501ea";
                      AppChannel = "unigramapp";
                  }
              }
          }
          "@
          Set-Content -Path "Telegram/Constants.Secret.cs" -Value $content

      - name: Download td_api.tl schema
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "Libraries/tdjson"
          Invoke-WebRequest -Uri "https://raw.githubusercontent.com/tdlib/td/master/td/generate/scheme/td_api.tl" -OutFile "Libraries/tdjson/td_api.tl"

      - name: Provide Prebuilt TDLib Binaries
        shell: pwsh
        run: |
          $tripletDir = "Libraries/tdjson/x64-uwp"
          New-Item -ItemType Directory -Force -Path $tripletDir
          
          # 直接从官方最新发布的 13.1.3 MSIX 安装包中解压提取纯正官方 tdjson 与配套底层依赖
          $msixUrl = "https://github.com/UnigramDev/Unigram/releases/download/v13.1.3/UnigramPackage_13.1.3.0_x64.msix"
          Write-Host "Downloading official Unigram package to extract tdjson..."
          Invoke-WebRequest -Uri $msixUrl -OutFile "official.msix"
          
          # 解包提取官方动态链接库
          Expand-Archive -Path "official.msix" -DestinationPath "extracted" -Force
          
          Copy-Item "extracted/tdjson.dll" -Destination "$tripletDir/tdjson.dll"
          Copy-Item "extracted/libcrypto-3-x64.dll" -Destination "$tripletDir/libcrypto-3-x64.dll"
          Copy-Item "extracted/libssl-3-x64.dll" -Destination "$tripletDir/libssl-3-x64.dll"
          Copy-Item "extracted/zlib1.dll" -Destination "$tripletDir/zlib1.dll"
          
          # 创建符号占位文件 tdjson.pdb
          New-Item -ItemType File -Force -Path "$tripletDir/tdjson.pdb"
          
          Write-Host "TDLib dependencies extracted successfully:"
          Get-ChildItem $tripletDir

      - name: Build Modern Release Package
        shell: pwsh
        run: |
          .\Build.Modern.ps1 -Platform x64 -Configuration Release -Mode SideloadOnly

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Unigram-PrismAyu-Package
          path: Telegram/AppPackages/**/*.msixbundle
